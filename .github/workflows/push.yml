name: push-manifest
on: workflow_dispatch
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Push manifest with a foreign layer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER_LC}/ce-w62-base"
          TOKEN=$(curl -s -u "${OWNER}:${GH_TOKEN}" "https://ghcr.io/token?scope=repository:${OWNER_LC}/ce-w62-base:push,pull&service=ghcr.io" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "token length ${#TOKEN}"
          echo '--- upload POST headers'
          curl -sS -i -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Length: 0" "https://ghcr.io/v2/${OWNER_LC}/ce-w62-base/blobs/uploads/" | head -12
          echo '--- end'
